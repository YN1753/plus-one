<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数字加1 · plusOne</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #1a1f35;
      --tile: #2a3152;
      --tile-hot: #3d4670;
      --ink: #f2f4ff;
      --muted: #8b93b5;
      --accent: #f5a524;
      --accent-2: #6ee7b7;
      --danger: #f87171;
      --board-size: min(92vw, 420px);
      font-family: "SF Pro Text", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 600px at 50% -10%, #243057 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
    }
    .wrap {
      width: min(94vw, 460px);
      padding: 24px 16px 32px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    h1 span { color: var(--accent); }
    .sub {
      color: var(--muted);
      font-size: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid #2c3355;
    }
    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 2px;
    }
    .stat .value {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .energy-pips {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      min-height: 8px;
    }
    .pip {
      width: 10px;
      height: 8px;
      border-radius: 2px;
      background: #3a4268;
    }
    .pip.on { background: var(--accent); }
    .board-shell {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      margin: 0 auto;
      background: var(--panel);
      border-radius: 16px;
      padding: 8px;
      border: 1px solid #2c3355;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      height: 100%;
    }
    .tile {
      border-radius: 10px;
      background: var(--tile);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: clamp(16px, 4.5vw, 24px);
      cursor: pointer;
      user-select: none;
      transition: transform .18s ease, background .18s ease, opacity .2s ease;
      border: 1px solid #3a436d;
    }
    .tile:hover { background: var(--tile-hot); transform: translateY(-1px); }
    .tile.merged {
      background: var(--accent);
      color: #1a1200;
      border-color: #ffc45a;
      animation: pop .32s ease;
    }
    .tile.spawned { animation: drop-in .28s ease; }
    .tile.locked { cursor: default; opacity: .85; }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes drop-in {
      from { transform: translateY(-28px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast {
      min-height: 22px;
      margin-top: 12px;
      text-align: center;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 600;
    }
    .toast.over { color: var(--danger); }
    .actions {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      background: var(--accent);
      color: #1a1200;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid #3a436d;
    }
    .hint {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .combo-flash {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-size: 42px;
      font-weight: 800;
      color: var(--accent);
      opacity: 0;
      text-shadow: 0 8px 30px rgba(0,0,0,.45);
    }
    .combo-flash.show { animation: combo .7s ease; }
    @keyframes combo {
      0% { opacity: 0; transform: scale(.8); }
      25% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>数字加<span>1</span></h1>
        <div class="sub">点击 +1 · 同数正交相连 ≥3 合成 · 连锁得分</div>
      </div>
    </header>

    <div class="stats">
      <div class="stat">
        <span class="label">得分</span>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat">
        <span class="label">连击</span>
        <div class="value" id="combo">0</div>
      </div>
      <div class="stat">
        <span class="label">体力</span>
        <div class="value" id="energy">5</div>
        <div class="energy-pips" id="pips"></div>
      </div>
    </div>

    <div class="board-shell">
      <div class="board" id="board"></div>
      <div class="combo-flash" id="flash"></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="actions">
      <button id="resetBtn" type="button">重新开始</button>
    </div>

    <div class="hint">
      仅上下左右连通。合成：score += N × val × 20，体力 +1（上限 5）。<br />
      高分方块生成概率更低，避免死局。
    </div>
  </div>

  <script type="module" src="./src/ui.js"></script>
</body>
</html>
